<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coding Mind244 | Bank System</title>
    <style>
        :root {
            /* Option 1: Tech Mix (Swap these lines with other options above) */
            --bg-gradient: linear-gradient(135deg, #042e51 0%, #0f9f80 100%);
            --accent: #2b5b84;
            --white: rgba(255, 255, 255, 0.95);
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .form-card {
            background: var(--white);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 400px;
            backdrop-filter: blur(10px);
        }

        h2 { text-align: center; color: #2c3e50; margin-bottom: 1.5rem; }

        .input-box { margin-bottom: 1rem; }
        
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #444; }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #eee;
            border-radius: 10px;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus { border-color: var(--accent); outline: none; }

        .btn-group { display: flex; gap: 10px; margin-top: 20px; }

        button {
            flex: 2;
            padding: 12px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-reset {
            flex: 1;
            background: #ec7f73; /* Red color for reset */
        }

        button:hover { opacity: 0.9; transform: translateY(-2px); }

        .prediction-result {
            margin-top: 20px;
            padding: 15px;
            background: #f1f9ff;
            border-radius: 10px;
            text-align: center;
            border-left: 5px solid var(--accent);
        }
    </style>
</head>
<body>

<div class="form-card">
    <h2>Bank Predictor</h2>
    <form action="{{ url_for('predict')}}" method="post">
        <div class="input-box">
            <label>Gender</label>
            <select name="gender">
                <option value="Male" name="Male" requied>Male</option>
                <option value="Female" name="Female" required>Female</option>
            </select>
        </div>

        <div class="input-box">
            <label>Age</label>
            <input type="number" name="age" required>
        </div>

        <div class="input-box">
            <label>Estimated Salary ($)</label>
            <input type="number" name="salary" required>
        </div>

        <div class="btn-group">
            <button type="submit">Predict</button>
            <button type="reset" class="btn-reset">Reset</button>
        </div>
    </form>

    {% if prediction_text %}
    <div class="prediction-result">
        <strong>{{ prediction_text }}</strong>
    </div>
    {% endif %}
</div>

</body>
</html>
